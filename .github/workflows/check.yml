name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the checker
        run: uv tool install git+https://github.com/TechTechWizard/claude-setup-kit

      - name: Check
        run: claude-setup check . --no-colour
